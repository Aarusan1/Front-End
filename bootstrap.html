<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hobby Cards</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #b8b0ef;
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px 15px;
        }

        h1{
            text-align: center;
            color: #11084c
        }

        .hobby-card {
            text-align: center;
            border: 2px solid #11084c;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #6177b2;
        }

        .hobby-card h3 {
           color: #11084c;
        }

        .c {
            font-style: bold;
        }
    </style>
</head>
<body>

    <div class="c">
    <h1>My Hobby Cards</h1>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                <h3>Drawing</h3>
                <p> I love sketching animals and comic book characters.</p>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Reading</h3>
                    <p> My favourite books are adventure stories.</p>
                </div>
            </div>
    
    
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Football</h3>
                    <p> I love playing football with my friends.</p>
                </div>
            </div>

            <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
            </script>
</body>
</html>
