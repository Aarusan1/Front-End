<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animal Fact File</title>
</head>
<style> 
    body {
        background-color: rgb(10, 10, 101);
        font-family: Arial,sans-serif;
    }

    .fact-file {
        background-color: rgb(198, 192, 207);
        color: rgb(97, 90, 90);
        width: 260px;
        padding: 25px;
        border: 15px solid rgb(72, 81, 166);
        margin: 30px;
    }

    .animal-name {
        color: rgb(50, 56, 104);
        font-size:22px
    }

    .detail {
        color: rgb(97, 90, 90);
    }

    .cool-fact {
        color: forestgreen;
        font-style: italic;
    }
</style>
<body>
    
    <div class="fact-file">
        <h1 class="animal-name">Snow Leopard</h1>
        <p class="detail">Type: Big Cat</p>
        <p class="detail">Lives in: The mountain ranges of Central Asia.</p>
        <p class="detail">Diet: Deer, goats and wild sheep</p>
        <p class="cool-fact">Cool Fact: Can leap up to 15m in one jump!</p>
    </div>
</body>
</html>
