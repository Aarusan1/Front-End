<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Doctor's Appointment</title>
</head>
<body>
    <h1>My Doctor's Appointment</h1>
<p> Fill in the form below to book your appointment </p>
<hr>
<form>
    <fieldset>
        <legend>Personal Details</legend>
        <label>Your Name
            <br>
            <input type="text" id="name" placeholder="Enter your full name" required>
            <br>
            <label>Personal ID
                <br>
                <input type="text" id = pid placeholder="Your Secret ID">
    
            </label>
            <br>
            <label>Date of Birth</label>
        <br>
        <input type = "date" id = dob>
        <br>
       
    </fieldset>
    
     <br>
     <fieldset>
<legend>Your Visit</legend>
<label>Choose your doctor</label><br>
<select id="doctor">    
   <option value="---">Select your doctor</option>
     <option value="drsmith">Dr. Smith</option>
        <option value="drjones">Dr. Jones</option>
        <option value="drbrown">Dr. Brown</option>
</select>
     </fieldset>

</form>

</body>
</html>
