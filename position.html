<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pet Page</title>
   <style>
    body{
    font-family: Arial,sans-serif;
    background-color: rgb(159, 147, 225);
    padding: 65px 30px 30px 30px;
    min-height: 1px;
}

h1, h2 { 
    color: rgb(34, 36, 57); }

    .top-bar {
        position: fixed;
        top:0;
        left:0;
        right:0;
        background-color: rgb(14, 22, 113);
        color: white;
        padding: 14px 20px;
    }

    .list-item {
        background-color: rgb(118, 143, 214);
        border: 2px solid rgb(34, 40, 94);
        padding: 10px 20px;
        margin: 5px 0px;
    }

    .special-note {
        position: relative;
        left: 30px;
        background-color: rgb(43, 69, 139);
        border: 3px solid rgb(34, 40, 94);
        padding: 10px 20px;
    }

    .pet-card{
        position: relative;
        background-color: rgb(43, 69, 139);
        border: 3px solid rgb(34, 40, 94);
        padding: 15px 25px;
    }

    .badge{
        position: absolute;
        top: 8px;
        right: 8px;
        background-color: forestgreen;
        color: white;
        padding: 4px 8px;
    }

    .section-label{
        position: sticky;
        top: 55px;
        background-color: rgb(14, 22, 113);
        color: rgb(118, 143, 214);
        padding: 10px 20px;
        margin: 15px 0 8px;
    }



   </style>

</head>

<body>
    <div class="top-bar"> My Pet Page - Buddy The Labrador </div>
    <h1> Meet Buddy!</h1>

    <h2> Static</h2>

    <div class="list-item"> Breed: Labrador</div>
</body>
</html>
